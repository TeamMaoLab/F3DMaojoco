[project]
name = "f3dmaojoco"
version = "0.1.0"
description = "Fusion 360 到 MuJoCo 的机器人模型转换与仿真控制工具链"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.3.5",
    "networkx>=3.5",
    "pypinyin>=0.55.0",
    "pyside6>=6.9.2",
    "pyvista>=0.46.3",
]

[dependency-groups]
dev = [
    "scipy>=1.18.0",
]
