<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>四足 LUT 驱动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #1a1a1a; color: #ddd; overflow: hidden; }
  #layout { display: flex; height: 100vh; }
  #viewport { flex: 1; position: relative; }
  canvas { display: block; }
  #panel { width: 340px; background: #252525; padding: 12px; overflow-y: auto; border-left: 1px solid #444; }
  h2 { font-size: 15px; margin-bottom: 6px; color: #fff; }
  h3 { font-size: 12px; margin: 12px 0 4px; color: #9cf; border-bottom: 1px solid #3a3a3a; padding-bottom: 3px; }
  .hint { font-size: 11px; color: #888; margin: 4px 0; line-height: 1.6; }
  .slider-row { margin: 8px 0; }
  .slider-row label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }
  .slider-row label .val { color: #4ec9b0; font-weight: bold; }
  input[type=range] { width: 100%; margin-top: 3px; }
  .passive { font-size: 11px; color: #9cf; margin-top: 6px; line-height: 1.6; }
  button { background: #36a; color: #fff; border: none; padding: 4px 9px; border-radius: 3px; cursor: pointer; font-size: 11px; margin: 2px 2px 2px 0; }
  button:hover { background: #48c; }
  button.active { background: #5a5; }
  button.danger { background: #933; }
  button.danger:hover { background: #b44; }
  /* 单腿分组 */
  .leg-card { background: #2c2c2c; border-left: 3px solid #555; padding: 7px 9px; margin: 6px 0; border-radius: 3px; }
  .leg-card.FL, .leg-card.RL { border-left-color: #666; }  /* 镜像腿标记 */
  .leg-card .leg-title { font-size: 11px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .leg-card .leg-title .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: middle; margin-right: 5px; }
  .leg-card .mini-slider { margin: 4px 0; }
  .leg-card .mini-slider label { font-size: 10px; color: #999; display: flex; justify-content: space-between; }
  .leg-card .mini-slider label .v { color: #4ec9b0; }
  .leg-card .mini-slider input[type=range] { margin-top: 2px; }
  .leg-card.compact { padding: 5px 9px; }
  /* 解空间迷你地图 */
  .ws-mini-wrap { display: flex; justify-content: center; margin: 4px 0; }
  .ws-mini { width: 140px; height: 140px; cursor: crosshair; image-rendering: pixelated; border: 1px solid #444; background: #222; }
  .ws-mini.dragging { cursor: grabbing; }
  .ws-readout { font-size: 10px; color: #aaa; text-align: center; margin-top: 2px; min-height: 14px; }
  .ws-readout.warn { color: #e8c530; }
  .ws-readout.bad { color: #ff6666; }
  .ws-legend { font-size: 9px; color: #777; display: flex; justify-content: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  .ws-legend i { display: inline-block; width: 7px; height: 7px; vertical-align: middle; margin-right: 2px; }
  #status { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.75); padding: 6px 10px; border-radius: 4px; font-size: 12px; max-width: 55%; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.9); padding: 15px 25px; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>
<div id="layout">
  <div id="viewport">
    <div id="status">加载中...</div>
    <div id="loading">加载中...</div>
  </div>
  <div id="panel">
    <h2>四足 LUT 分控驱动</h2>
    <div class="hint">4 条腿独立控制。全局滑块联动全部，分控滑块覆盖单腿。
        镜像腿(FL/RL)关节角自动取负（Rx(π)·Ry(θ)·Rx(π)⁻¹=Ry(-θ)）。</div>

    <h3>全局控制</h3>
    <div class="slider-row">
      <label>θ1 膝盖舵机 <span class="val" id="t1val">0°</span></label>
      <input type="range" id="t1Slider" min="-90" max="60" value="0" step="1">
    </div>
    <div class="slider-row">
      <label>θ2 大腿舵机 <span class="val" id="t2val">0°</span></label>
      <input type="range" id="t2Slider" min="-60" max="60" value="0" step="1">
    </div>
    <div class="passive" id="passiveInfo">
      全局被动角（LUT 解）：<br>
      t3=<span id="p_t3">0.0</span>° t4=<span id="p_t4">0.0</span>°<br>
      t6=<span id="p_t6">0.0</span>° t7=<span id="p_t7">0.0</span>°
    </div>
    <div style="margin-top:8px">
      <button onclick="resetAllPose()">回零位(站立)</button>
      <button onclick="resetView()">重置视角</button>
    </div>
    <div class="hint" style="margin-top:4px">零位 (0,0) = 站立姿态（足端贴地）</div>

    <h3>分腿控制</h3>
    <div id="legCards"></div>

    <h3>预设动作</h3>
    <div style="margin-top:4px">
      <button onclick="presetStanding()">站立</button>
      <button onclick="presetWave()">挥手</button>
      <button onclick="presetMarch()">原地踏步</button>
      <button class="danger" onclick="stopPreset()">停止</button>
    </div>
    <div class="hint" style="margin-top:4px">挥手/原地踏步 = 足端轨迹驱动，机身静止。侧倾/坐下需要机身动，待做。</div>

    <h3>trot 步态参数</h3>
    <div class="slider-row">
      <label>步幅 stride <span class="val" id="trotStrideVal">15mm</span></label>
      <input type="range" id="trotStride" min="0" max="40" value="15" step="1">
    </div>
    <div class="slider-row">
      <label>抬腿高度 swing <span class="val" id="trotSwingVal">15mm</span></label>
      <input type="range" id="trotSwing" min="0" max="40" value="15" step="1">
    </div>
    <div class="slider-row">
      <label>周期 T <span class="val" id="trotPeriodVal">1.5s</span></label>
      <input type="range" id="trotPeriod" min="5" max="40" value="15" step="1">
    </div>
    <div style="margin-top:4px">
      <button onclick="presetTrot()" style="background:#5a5">▶ 启动 trot</button>
    </div>
    <div class="hint" style="margin-top:6px">trot = 足端轨迹驱动真步态。参数可拖动，下次启动生效。</div>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/examples/js/loaders/STLLoader.js"></script>
<script src="vendor/examples/js/controls/OrbitControls.js"></script>
<script>
const PARTS_URL = '../exports/quad_v4/parts_world.json';
const KIN_URL = '../exports/quad_v4/leg_kinematic.json';
const LUT_URL = 'workspace_lut.json';
const FOOT_URL = '../exports/quad_v4/foot_lut.json';
const STL_BASE = '../exports/quad_v4/stl_files/';

let scene, camera, renderer, controls;
const stlLoader = new THREE.STLLoader();
let lutData = null;
let kinematic = null;
let partsData = null;
let footLut = null;  // 足端表：samples[i] = {theta:[t1,t2], foot:[x,z]}（FR 腿，世界坐标）

// 4 腿配置：腿根世界坐标(mm) + 是否镜像
const LEGS = [
  { key:'FR', root:[0,-47,0],   mirror:false, color:0xee5555 },
  { key:'RR', root:[115,-47,0], mirror:false, color:0xee9900 },
  { key:'FL', root:[0,47,0],    mirror:true,  color:0x44ccff },
  { key:'RL', root:[115,47,0],  mirror:true,  color:0xcc66ff },
];

// 运动学树（从 leg_kinematic.json 加载后填充）
let bodyTree = null;
// legGroups: key → { group: THREE.Group(腿根), bodies: {bodyName: THREE.Group(关节group)} }
const legGroups = {};

function init() {
  const vp = document.getElementById('viewport');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1e1e22);
  camera = new THREE.PerspectiveCamera(45, vp.clientWidth/vp.clientHeight, 0.1, 5000);
  camera.up.set(0,0,1);
  camera.position.set(180, -250, 140);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(vp.clientWidth, vp.clientHeight);
  vp.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(57, 0, -30);

  scene.add(new THREE.AmbientLight(0x666666));
  const dl = new THREE.DirectionalLight(0xffffff, 0.85); dl.position.set(150,-150,250); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.35); dl2.position.set(-100,100,80); scene.add(dl2);

  const grid = new THREE.GridHelper(300, 15, 0x333355, 0x222233);
  grid.rotation.x = Math.PI/2;
  grid.position.z = -79;  // 地面在足端高度
  scene.add(grid);
  scene.add(new THREE.AxesHelper(25));

  loadData();
  bindSliders();
  window.addEventListener('resize', onResize);
  // 调试用：暴露给自动化测试读取场景状态
  window.scene = scene;
  window.THREE = THREE;
  window.legGroups = legGroups;
  window.legState = legState;
  window.legCtrl = legCtrl;
  animate();
}

async function loadData() {
  setStatus('加载 LUT...');
  lutData = await (await fetch(LUT_URL)).json();
  setStatus('加载运动学...');
  kinematic = await (await fetch(KIN_URL)).json();
  bodyTree = kinematic.bodies;
  setStatus('加载足端表...');
  footLut = await (await fetch(FOOT_URL)).json();
  setStatus('加载零件...');
  partsData = await (await fetch(PARTS_URL)).json();

  // 加载机身零件（非腿）
  loadChassis();

  // 构建 4 条腿
  let legsLoaded = 0;
  for (const leg of LEGS) {
    buildLeg(leg, () => {
      legsLoaded++;
      setStatus(`加载腿 ${legsLoaded}/4`);
      if (legsLoaded >= LEGS.length) {
        document.getElementById('loading').style.display = 'none';
        buildLegCards();
        globalUpdate(0, 0);
        setStatus('就绪。全局滑块联动 4 腿，分控滑块独立调单腿。');
      }
    });
  }
}

function loadChassis() {
  // 机身零件（零部件5/电池/电路板）
  const chassisNames = ['零部件5','假电池 v1','假电路板 v1'];
  for (const p of partsData.parts) {
    if (chassisNames.some(n => p.component === n) || chassisNames.some(n => p.component.includes(n))) {
      if (p.component.includes('镜像')) continue;
      loadSTL(p, mesh => {
        mesh.material = new THREE.MeshPhongMaterial({color:0x888899, transparent:true, opacity:0.5});
        scene.add(mesh);
      });
    }
  }
}

function loadSTL(part, cb) {
  const url = STL_BASE + encodeURIComponent(part.stl_file.split('/').pop());
  stlLoader.load(url, geo => {
    const mesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({color:0x999999, shininess:20, transparent:true, opacity:0.9, side:THREE.DoubleSide}));
    mesh.position.set(part.world_t_mm[0], part.world_t_mm[1], part.world_t_mm[2]);
    const R = part.world_rot;
    const M = new THREE.Matrix4();
    M.set(R[0][0],R[0][1],R[0][2],0, R[1][0],R[1][1],R[1][2],0, R[2][0],R[2][1],R[2][2],0, 0,0,0,1);
    mesh.setRotationFromMatrix(M);
    cb(mesh);
  }, undefined, err => {
    console.error('STL加载失败:', part.stl_file, err);
    setStatus('STL加载失败: ' + part.stl_file);
  });
}

// 为每条腿找对应的 parts_world 零件（镜像腿用镜像 STL）
function findLegParts(leg) {
  const legOcc = {
    FR: '舵机组 v8:1', RR: '舵机组 v8:2',
    FL: '舵机组 v8(镜像) (1):1', RL: '舵机组 v8(镜像) (1):2'
  }[leg.key];
  return partsData.parts.filter(p => p.full_path.includes(legOcc));
}

function buildLeg(leg, onDone) {
  // 腿根 Group：世界位置 + 镜像腿加 diag(1,-1,-1)（180°绕X）
  const rootGroup = new THREE.Group();
  rootGroup.position.set(leg.root[0], leg.root[1], leg.root[2]);
  if (leg.mirror) rootGroup.rotation.set(Math.PI, 0, 0);
  scene.add(rootGroup);

  // 各腿用自己的零件（镜像腿用镜像 STL，保证静态几何左右镜像）
  const legParts = findLegParts(leg);

  // 运动学树 anchor：镜像腿 Z 取负（Rx(π) 局部系下，原版 anchor 会翻到头顶）
  // 镜像 anchor 经 Rx(π) 变换后回到地面方向，和原版腿对称
  const tree = bodyTree.map(b => {
    const ja = leg.mirror
      ? [b.joint_anchor_mm[0], b.joint_anchor_mm[1], -b.joint_anchor_mm[2]]
      : b.joint_anchor_mm.slice();
    return { ...b, anchor: ja };
  });

  // 运动学树：构建嵌套关节 Group
  // 每个 body 的 group 原点 = 它的关节点（相对父 body）
  const bodies = {};
  legGroups[leg.key] = { group: rootGroup, bodies, mirror: leg.mirror, color: leg.color };

  for (const b of tree) {
    const jg = new THREE.Group();
    // group position = 相对父关节点的偏移
    // parent=None 时用 anchor（相对腿根）；否则用 (本关节点 - 父关节点)
    let pos;
    if (b.parent) {
      const parentB = tree.find(x => x.name === b.parent);
      pos = [
        b.anchor[0] - parentB.anchor[0],
        b.anchor[1] - parentB.anchor[1],
        b.anchor[2] - parentB.anchor[2],
      ];
    } else {
      pos = b.anchor;
    }
    jg.position.set(pos[0], pos[1], pos[2]);
    bodies[b.name] = { group: jg, def: b };
  }
  // 父子挂载
  for (const b of tree) {
    if (b.parent) bodies[b.parent].group.add(bodies[b.name].group);
    else rootGroup.add(bodies[b.name].group);
  }

  // 零件 STL → body 映射
  const cnMap = {
    knee_driver:'膝盖动力发生器', knee_link1:'膝盖传动1',
    knee_rotor:'膝盖转动', knee_link2:'膝盖传动2', shin:'小腿',
  };
  const thighParts = ['大腿主动力发生器','小腿保持架','髋关节保持架','大腿盖板'];

  const partsToLoad = [];
  for (const b of bodyTree) {
    const cns = b.name === 'thigh_rigid' ? thighParts : [cnMap[b.name]];
    for (const cn of cns) {
      // 精确匹配：component 去掉镜像/版本后缀后 == cn
      const p = legParts.find(pp => {
        const base = pp.component.replace(/\(镜像\).*$/, '').replace(/\(2\).*$/, '').replace(/\(3\).*$/, '').trim();
        return base === cn;
      });
      if (p) partsToLoad.push({ bodyName: b.name, part: p });
    }
  }

  // 舵机壳（固定在腿根，不跟随关节）
  const servos = legParts.filter(p => p.component.includes('servo'));
  let total = partsToLoad.length + servos.length;
  let loaded = 0;
  const done = () => { if (++loaded >= total && onDone) onDone(); };

  // 加载动件 STL
  // STL 顶点是「相对腿根」的坐标（零件建模原点在腿根）。
  // body group 原点在关节点（相对腿根坐标系）。
  // 所以 mesh 挂到 body group 时，position = -(body的世界累积偏移) 让顶点回到腿根坐标系。
  // 但因为父 group 已经累积了偏移，这里只需补偿本 body 相对腿根的总关节点位置。
  for (const item of partsToLoad) {
    const b = tree.find(x => x.name === item.bodyName);
    stlLoader.load(STL_BASE + encodeURIComponent(item.part.stl_file.split('/').pop()), geo => {
      const mesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
        color: leg.color, shininess:20, transparent:true, opacity:0.92, side:THREE.DoubleSide
      }));
      // STL 顶点相对腿根，body group 原点在关节点（相对腿根）
      // mesh.position = -anchor 让顶点回到腿根坐标系
      // 顶点世界 = body_group_world × mesh.position + 顶点
      // body_group 在关节点，所以 mesh.position = -(本body关节点相对腿根)
      mesh.position.set(-b.anchor[0], -b.anchor[1], -b.anchor[2]);
      bodies[item.bodyName].group.add(mesh);
      done();
    }, undefined, () => done());
  }

  // 舵机壳：固定件，直接用世界变换挂 scene（和 quad_stl_viewer 一致）
  // 不跟关节动，也不需要算 rootRotInv × world_rot——世界变换就是最终答案
  for (const p of servos) {
    stlLoader.load(STL_BASE + encodeURIComponent(p.stl_file.split('/').pop()), geo => {
      const mesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
        color:0x555555, transparent:true, opacity:0.9, side:THREE.DoubleSide
      }));
      mesh.position.set(p.world_t_mm[0], p.world_t_mm[1], p.world_t_mm[2]);
      const R = p.world_rot;
      const M = new THREE.Matrix4();
      M.set(R[0][0],R[0][1],R[0][2],0, R[1][0],R[1][1],R[1][2],0, R[2][0],R[2][1],R[2][2],0, 0,0,0,1);
      mesh.setRotationFromMatrix(M);
      scene.add(mesh);
      done();
    }, undefined, () => done());
  }
}

// LUT 查表 + 双线性插值（含可达性：collision/connected）
// 参考 app.js lutInterp 的保守判断：任一角点碰撞→整格碰撞，任一角点不连通→整格不可进
function lookupLUT(t1, t2) {
  const cells = lutData.cells;
  const step = lutData._meta.step || 2;

  const t1l = Math.floor(t1/step)*step;
  const t1h = t1l + step;
  const t2l = Math.floor(t2/step)*step;
  const t2h = t2l + step;
  const fx = (t1 - t1l)/step;
  const fy = (t2 - t2l)/step;

  const c00 = cells[`${t1l},${t2l}`];
  const c10 = cells[`${t1h},${t2l}`];
  const c01 = cells[`${t1l},${t2h}`];
  const c11 = cells[`${t1h},${t2h}`];
  if (!c00 || !c10 || !c01 || !c11) return null;

  function lerp(a,b,f){return a+(b-a)*f;}
  function bl(k){
    return lerp(lerp(c00[k],c10[k],fx), lerp(c01[k],c11[k],fx), fy);
  }
  // 可达性：任一角点碰撞/孤岛 → 整格不可进
  const corners = [c00, c10, c01, c11];
  const collision = corners.some(c => c.collision);
  const connected = corners.every(c => c.connected !== false);
  return {
    t1:bl('t1'), t2:bl('t2'), t3:bl('t3'), t4:bl('t4'), t6:bl('t6'), t7:bl('t7'),
    collision, connected,
    allowed: !collision && connected,  // 绿区才能进
  };
}

// 解空间状态码（用于地图上色）：0=不可达 1=绿(可达连通) 2=红(碰撞) 3=黄(孤岛)
function lutCellStatus(t1, t2) {
  const c = lutData.cells[`${t1},${t2}`];
  if (!c) return 0;
  if (c.collision) return 2;
  if (c.connected === false) return 3;
  return 1;
}

// === 状态管理 ===
// 每条腿独立姿态：legState[key] = {t1, t2}（滑块/预设用，整数）
const legState = {};
// 每条腿追踪状态：legCtrl[key] = {safeT1, safeT2, targetT1, targetT2, stepping}（地图追踪用，浮点）
const legCtrl = {};
LEGS.forEach(l => legState[l.key] = {t1:0, t2:0});

// 应用单条腿姿态（只动这条腿）
// 碰撞守卫：若 (t1,t2) 在碰撞/孤岛区，不更新 3D（保持上一合法姿态），返回带 collision 标记的 lut
function applyLeg(legKey, t1Deg, t2Deg) {
  const leg = LEGS.find(l => l.key === legKey);
  const lg = legGroups[legKey];
  if (!leg || !lg) return null;
  const lut = lookupLUT(t1Deg, t2Deg);
  if (!lut) return null;  // 无解
  if (!lut.allowed) return lut;  // 碰撞/孤岛：不更新 3D，但返回状态供调用方判断
  // 镜像腿关节角取负：数值验证 Rx(π)·Ry(θ)·Rx(π)⁻¹ = Ry(-θ)
  const sign = leg.mirror ? -1 : 1;
  for (const b of bodyTree) {
    const bg = lg.bodies[b.name].group;
    const angle = lut[b.joint] * sign;
    bg.rotation.set(0, angle * Math.PI/180, 0);
  }
  return lut;
}

// 全局滑块 → 4 腿同步（直接跳，不走追踪）
function globalUpdate(v1, v2) {
  document.getElementById('t1val').textContent = v1 + '°';
  document.getElementById('t2val').textContent = v2 + '°';
  // 全局 LUT 被动角
  const lut = lookupLUT(v1, v2);
  if (lut) {
    document.getElementById('p_t3').textContent = lut.t3.toFixed(1);
    document.getElementById('p_t4').textContent = lut.t4.toFixed(1);
    document.getElementById('p_t6').textContent = lut.t6.toFixed(1);
    document.getElementById('p_t7').textContent = lut.t7.toFixed(1);
  }
  // 4 腿直接跳到位
  for (const leg of LEGS) setLegImmediate(leg.key, v1, v2);
}

// === 解空间地图绘制 ===
// canvas 是 181×181，每像素一个 (θ1,θ2) 格（step=2 对应 -180..180）
// 直接画底图（一次），指针层每帧重画（用 drawPointer 复制底图 + 画指针）
const wsBaseCache = {};  // legKey → offscreen canvas（底图缓存）
const WS_RANGE = 180;
const WS_N = 181;

function drawMap(legKey) {
  const canvas = document.getElementById('ws_'+legKey);
  if (!canvas || !lutData) return;
  const ctx = canvas.getContext('2d');
  const N = WS_N;
  const cellW = canvas.width / N;
  const cellH = canvas.height / N;
  const colors = ['#222222', '#27ae60', '#c72626', '#e8c530']; // 0不可达 1绿 2红 3黄
  // 遍历 LUT 所有 cell
  for (let i = 0; i < N; i++) {       // i = θ1 索引
    const t1 = -WS_RANGE + i*2;
    for (let j = 0; j < N; j++) {     // j = θ2 索引
      const t2 = -WS_RANGE + j*2;
      const status = lutCellStatus(t1, t2);
      ctx.fillStyle = colors[status] || '#222';
      // Y 轴翻转：θ2 +180 在上方
      ctx.fillRect(i*cellW, (N-1-j)*cellH, Math.ceil(cellW), Math.ceil(cellH));
    }
  }
  // 原点十字
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  const [zx, zy] = angleToCanvas(0, 0, canvas);
  ctx.beginPath();
  ctx.moveTo(zx, 0); ctx.lineTo(zx, canvas.height);
  ctx.moveTo(0, zy); ctx.lineTo(canvas.width, zy);
  ctx.stroke();
  // 缓存底图
  const off = document.createElement('canvas');
  off.width = canvas.width; off.height = canvas.height;
  off.getContext('2d').drawImage(canvas, 0, 0);
  wsBaseCache[legKey] = off;
}

// 角度 → canvas 像素坐标
function angleToCanvas(t1, t2, canvas) {
  return [
    ((t1 + WS_RANGE) / (2*WS_RANGE)) * canvas.width,
    canvas.height - ((t2 + WS_RANGE) / (2*WS_RANGE)) * canvas.height
  ];
}
// canvas 像素 → 角度
function canvasToAngle(x, y, canvas) {
  const fx = x / canvas.width;
  const fy = y / canvas.height;
  return [
    Math.round(fx * 2*WS_RANGE - WS_RANGE),
    Math.round((1 - fy) * 2*WS_RANGE - WS_RANGE)
  ];
}

// 重画指针层（复制底图 + 当前/目标点）
function drawPointer(legKey) {
  const canvas = document.getElementById('ws_'+legKey);
  const base = wsBaseCache[legKey];
  if (!canvas || !base) return;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(base, 0, 0);
  const ctrl = legCtrl[legKey];
  // 当前位置（实心黄/红）
  const [x, y] = angleToCanvas(ctrl.safeT1, ctrl.safeT2, canvas);
  const lut = lookupLUT(ctrl.safeT1, ctrl.safeT2);
  ctx.fillStyle = (!lut || lut.collision) ? '#ff4444' :
                  (lut.connected === false ? '#e8c530' : '#ffcc00');
  ctx.beginPath();
  ctx.arc(x, y, 4, 0, Math.PI*2);
  ctx.fill();
  // 目标位置（空心蓝，如果和当前不同）
  if (Math.abs(ctrl.targetT1 - ctrl.safeT1) > 0.5 || Math.abs(ctrl.targetT2 - ctrl.safeT2) > 0.5) {
    const [tx, ty] = angleToCanvas(ctrl.targetT1, ctrl.targetT2, canvas);
    ctx.strokeStyle = '#88ccff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(tx, ty, 4, 0, Math.PI*2);
    ctx.stroke();
  }
}

// 绑定拖动交互
function bindWsCanvas(canvas, legKey) {
  let dragging = false;
  const handle = (e) => {
    if (!lutData) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * canvas.width;
    const y = (e.clientY - rect.top) / rect.height * canvas.height;
    let [t1, t2] = canvasToAngle(x, y, canvas);
    t1 = Math.max(-WS_RANGE, Math.min(WS_RANGE, t1));
    t2 = Math.max(-WS_RANGE, Math.min(WS_RANGE, t2));
    setLegTarget(legKey, t1, t2);
  };
  canvas.addEventListener('mousedown', (e) => {
    dragging = true;
    canvas.classList.add('dragging');
    stopPreset();
    handle(e);
  });
  canvas.addEventListener('mousemove', (e) => { if (dragging) handle(e); });
  window.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; canvas.classList.remove('dragging'); }
  });
}

// === 追踪系统 ===
const MAX_STEP_DRAG = 2.0;    // 拖地图：慢、精细
const MAX_STEP_PRESET = 3.0;  // 预设：每 animate 帧最大角度步进（度），60fps → 180°/s

// isAllowed: 绿区才能进（不碰撞 + 连通）
function isAllowed(t1, t2) {
  const lut = lookupLUT(t1, t2);
  return lut && lut.allowed;
}

// 设目标 → 启动追踪
// maxStep: 每帧最大角度步进（度），拖动用小值，预设用大值
function setLegTarget(legKey, t1, t2, maxStep) {
  const ctrl = legCtrl[legKey];
  ctrl.targetT1 = t1;
  ctrl.targetT2 = t2;
  ctrl.maxStep = maxStep || MAX_STEP_DRAG;
  ctrl.stepping = true;
}

// 直接跳（预设/滑块用）→ 校验可达后直接到位
function setLegImmediate(legKey, t1, t2) {
  const ctrl = legCtrl[legKey];
  ctrl.targetT1 = t1;
  ctrl.targetT2 = t2;
  ctrl.safeT1 = t1;
  ctrl.safeT2 = t2;
  ctrl.stepping = false;
  legState[legKey].t1 = Math.round(t1);
  legState[legKey].t2 = Math.round(t2);
  syncLegCardUI(legKey);
  applyLeg(legKey, t1, t2);
  updateReadout(legKey);
  drawPointer(legKey);
}

// 静默设目标（预设循环用）：只动 3D，不碰 DOM/canvas
// 不直接跳到 (t1,t2)，而是用低通滤波平滑追过去，消除 IK 反查的网格跳变（2-4°阶跃）
// alpha：每帧追向目标的比例（0.15 默认慢追；挥手等大范围动作可用更大值）
const SILENT_ALPHA = 0.15;
function setLegSilent(legKey, t1, t2, alpha) {
  const ctrl = legCtrl[legKey];
  ctrl.targetT1 = t1;
  ctrl.targetT2 = t2;
  const a = alpha || SILENT_ALPHA;
  ctrl.safeT1 += (t1 - ctrl.safeT1) * a;
  ctrl.safeT2 += (t2 - ctrl.safeT2) * a;
  ctrl.stepping = false;
  applyLeg(legKey, ctrl.safeT1, ctrl.safeT2);
}

// 批量刷新腿的 UI/canvas（降频调用）
function refreshLegUI(legKey) {
  legState[legKey].t1 = Math.round(legCtrl[legKey].safeT1);
  legState[legKey].t2 = Math.round(legCtrl[legKey].safeT2);
  syncLegCardUI(legKey);
  updateReadout(legKey);
  drawPointer(legKey);
}

// 每帧小步追向 target（animate 调用）
function stepLegTowards(legKey) {
  const ctrl = legCtrl[legKey];
  if (!ctrl || !ctrl.stepping) return;
  const dt1 = ctrl.targetT1 - ctrl.safeT1;
  const dt2 = ctrl.targetT2 - ctrl.safeT2;
  const dist = Math.hypot(dt1, dt2);
  if (dist < 0.5) {
    ctrl.stepping = false;
    applyLeg(legKey, ctrl.safeT1, ctrl.safeT2);
    updateReadout(legKey);
    syncLegCardUI(legKey);
    drawPointer(legKey);
    return;
  }
  const step = Math.min(ctrl.maxStep || MAX_STEP_DRAG, dist);
  const nx = ctrl.safeT1 + (dt1/dist) * step;
  const ny = ctrl.safeT2 + (dt2/dist) * step;
  if (isAllowed(nx, ny)) {
    ctrl.safeT1 = nx;
    ctrl.safeT2 = ny;
  } else {
    // 碰墙：尝试贴边滑动（只走 θ1 或只走 θ2）
    // 注意：dt 分量为 0 时不能算"移动"，否则会误判 stepping 永真
    let moved = false;
    const stepT1 = (dt1/dist) * step;
    const stepT2 = (dt2/dist) * step;
    if (Math.abs(stepT1) > 1e-4 && isAllowed(ctrl.safeT1 + stepT1, ctrl.safeT2)) {
      ctrl.safeT1 += stepT1; moved = true;
    }
    if (Math.abs(stepT2) > 1e-4 && isAllowed(ctrl.safeT1, ctrl.safeT2 + stepT2)) {
      ctrl.safeT2 += stepT2; moved = true;
    }
    if (!moved) ctrl.stepping = false;  // 完全挡住，停
  }
  legState[legKey].t1 = Math.round(ctrl.safeT1);
  legState[legKey].t2 = Math.round(ctrl.safeT2);
  applyLeg(legKey, ctrl.safeT1, ctrl.safeT2);
  updateReadout(legKey);
  syncLegCardUI(legKey);
  drawPointer(legKey);
}

// 更新读数（θ1/θ2 + 警告）
function updateReadout(legKey) {
  const el = document.getElementById('ws_'+legKey+'_readout');
  if (!el) return;
  const ctrl = legCtrl[legKey];
  const lut = lookupLUT(ctrl.safeT1, ctrl.safeT2);
  el.classList.remove('warn', 'bad');
  let suffix = '';
  if (!lut) { suffix = ' · 不可达'; el.classList.add('bad'); }
  else if (lut.collision) { suffix = ' · 碰撞'; el.classList.add('bad'); }
  else if (lut.connected === false) { suffix = ' · 孤岛'; el.classList.add('warn'); }
  el.textContent = `θ1=${Math.round(ctrl.safeT1)}° θ2=${Math.round(ctrl.safeT2)}°${suffix}`;
}

// === 复位/站姿 ===
function resetAllPose() {

  document.getElementById('t2Slider').value = 0;
  globalUpdate(0, 0);
}
function resetView() {

// === 预设动作（循环动画用 requestAnimationFrame）===
let presetHandle = null;
function stopPreset() {
  if (presetHandle) {
    cancelAnimationFrame(presetHandle);
    presetHandle = null;
    setStatus('已停止预设');
  }
}
function runLoop(fn) {
  stopPreset();
  const start = performance.now();
  const tick = (now) => {
    const t = (now - start) / 1000;  // 秒
    fn(t);
    presetHandle = requestAnimationFrame(tick);
  };
  presetHandle = requestAnimationFrame(tick);
}
// 设置单腿姿态（预设用，直接跳，复用 setLegImmediate）
function setLegQuiet(legKey, t1, t2) {
  setLegImmediate(legKey, t1, t2);
}

// 站立基准（所有预设基于此）：(0,0) 在解空间里足端正好贴地（grid.z=-79）
const STAND = [0, 0];

// 站立（静态）= 零位，直接到位
function presetStanding() {
  stopPreset();
  for (const leg of LEGS) setLegImmediate(leg.key, STAND[0], STAND[1]);
  setStatus('预设：站立（零位）');
}
// 对角小步（trot）：FR+RL 一组，FL+RR 一组，反相
// 围绕 STAND 平滑振荡，直接到位（target 本身是平滑正弦，无跳变）
// 碰撞由 applyLeg 守卫：轨迹进入碰撞区时该帧不更新 3D
// === 足端逆运动学（LUT 反查）===
// footLut.samples 是 FR 腿的 θ→足端世界坐标表（footLut.leg_root = [0,-47,0]）
// 其他腿用同样的 θ，因为 4 条腿几何一致（镜像只影响朝向，足端相对腿根的偏移一致）

// 足端目标(相对腿根 X,Z) → 最近邻 (θ1,θ2)，线性扫描 samples（带缓存）
const _footCache = new Map();  // "x,z" → theta
function footToTheta(targetX, targetZ) {
  if (!footLut) return null;
  // 量化到 0.5mm 减少缓存粒度（连续轨迹命中率高）
  const qx = Math.round(targetX * 2) / 2;
  const qz = Math.round(targetZ * 2) / 2;
  const key = qx + ',' + qz;
  if (_footCache.has(key)) return _footCache.get(key);
  let best = null, bestD = Infinity;
  for (const s of footLut.samples) {
    const dx = s.foot[0] - qx;
    const dz = s.foot[1] - qz;
    const d = dx*dx + dz*dz;
    if (d < bestD) { bestD = d; best = s.theta; }
  }
  _footCache.set(key, best);
  return best;
}

// === trot 足端轨迹 ===
// 每条腿一个周期 T：撑地相 + 摆动相
//   撑地相（phase 0..0.5）：足端踩地不动，机身前进 → 足端相对机身向后滑（X 增大）
//                          视觉：撑地腿在地上往后扫 = 机器人前进
//   摆动相（phase 0.5..1）：足端抬起空中前摆（X 减小），准备下次落地
// 坐标系约定：X+ = 机器人后方（RR/RL 在 X=115）。前进 = X 减小方向。
// 坐标：相对腿根的足端目标（FR 腿根 X=0，站立零位足端 foot=[-7.2,-79.1]）
function trotFoot(t, cfg, offset) {
  const phase = (((t / cfg.T) + offset) % 1 + 1) % 1;  // 0..1
  const baseX = cfg.standFootX;
  const baseZ = cfg.standFootZ;
  if (phase < 0.5) {
    // 撑地相：足端从前摆到后（X 从 -stride 到 +stride，相对机身向后扫 = 前进）
    const f = phase / 0.5;  // 0..1
    return [baseX + cfg.stride * (2*f - 1), baseZ];
  } else {
    // 摆动相：足端从后弧线回到前（X 从 +stride 到 -stride），Z 抬起
    const f = (phase - 0.5) / 0.5;  // 0..1
    const x = baseX + cfg.stride * (1 - 2*f);
    const z = baseZ + cfg.swingHeight * Math.sin(Math.PI * f);
    return [x, z];
  }
}

// trot：足端轨迹驱动（真步态）
// 3 参数从滑块读：stride（步幅）、swingHeight（抬腿）、T（周期）
function presetTrot() {
  if (!footLut) { setStatus('❌ 足端表未加载'); return; }
  const stride = parseInt(document.getElementById('trotStride').value);
  const swingHeight = parseInt(document.getElementById('trotSwing').value);
  const T = parseInt(document.getElementById('trotPeriod').value) / 10;  // 滑块 5-40 → 0.5-4.0s
  const cfg = {
    stride, swingHeight, T,
    standFootX: footLut.samples[0].foot[0],
    standFootZ: footLut.samples[0].foot[1],
  };
  let lastUIRefresh = 0;
  runLoop(t => {
    for (const leg of LEGS) {
      const offset = (leg.key === 'FR' || leg.key === 'RL') ? 0 : 0.5;
      const [fx, fz] = trotFoot(t, cfg, offset);
      const theta = footToTheta(fx, fz);
      if (theta) setLegSilent(leg.key, theta[0], theta[1]);
    }
    // UI/canvas 降频更新（每 100ms 一次，避免每帧重画 4 canvas 卡顿）
    if (t - lastUIRefresh > 0.1) {
      lastUIRefresh = t;
      for (const leg of LEGS) refreshLegUI(leg.key);
    }
    setStatus(`trot t=${t.toFixed(1)}s stride=${stride} swing=${swingHeight} T=${T.toFixed(1)}s`);
  });
}
// 挥手：3 腿站立，FL 腿先伸到 (60,77) 对应的足端位置，然后在该位置小范围戳戳
// 两段式：t<reach 移动阶段（从站立位插值到目标），t>=reach 戳戳阶段（小幅度振荡）
function presetWave() {
  if (!footLut) { setStatus('❌ 足端表未加载'); return; }
  const baseX = footLut.samples[0].foot[0];  // 站立足端 X ≈ -7
  const baseZ = footLut.samples[0].foot[1];  // 站立足端 Z ≈ -79
  // 目标足端位置（θ=(60,77) 对应，腿前伸高举）
  const reachX = -84, reachZ = -33;
  const reachTime = 1.0;   // 移动阶段时长（秒）
  const jabAmp = 6;        // 戳戳振幅 mm（小范围）
  const jabFreq = 4;       // 戳戳频率 Hz
  let lastUI = 0;
  runLoop(t => {
    // 3 腿站立支撑
    setLegSilent('FR', 0, 0);
    setLegSilent('RR', 0, 0);
    setLegSilent('RL', 0, 0);
    // FL 足端目标
    let fx, fz;
    if (t < reachTime) {
      // 移动阶段：从站立位平滑插值到 reach 位（用 smoothstep 缓动）
      const f = t / reachTime;
      const s = f * f * (3 - 2 * f);  // smoothstep
      fx = baseX + (reachX - baseX) * s;
      fz = baseZ + (reachZ - baseZ) * s;
    } else {
      // 戳戳阶段：在 reach 位小范围振荡（沿 X 方向戳）
      const jab = Math.sin((t - reachTime) * jabFreq * 2 * Math.PI) * jabAmp;
      fx = reachX + jab;
      fz = reachZ;
    }
    const theta = footToTheta(fx, fz);
    if (theta) setLegSilent('FL', theta[0], theta[1], 0.4);
    if (t - lastUI > 0.1) { lastUI = t; for (const leg of LEGS) refreshLegUI(leg.key); }
    const stage = t < reachTime ? `伸到位 ${(t/reachTime*100).toFixed(0)}%` : '戳戳中';
    setStatus(`预设：FL 挥手 [${stage}] t=${t.toFixed(1)}s`);
  });
}

// 原地踏步（march）：4 腿依次抬放，任一时刻 ≥3 腿撑地
// 占空比 0.75（撑地 75%），相位顺序错开 0.25
// 足端轨迹：撑地相贴地不动（原地踏步，不前进），摆动相抬起 + 原地小步前后
function presetMarch() {
  if (!footLut) { setStatus('❌ 足端表未加载'); return; }
  const stride = Math.min(parseInt(document.getElementById('trotStride').value), 10);  // 原地踏步步幅小
  const swingHeight = parseInt(document.getElementById('trotSwing').value);
  const T = parseInt(document.getElementById('trotPeriod').value) / 10;
  const cfg = {
    stride, swingHeight, T,
    standFootX: footLut.samples[0].foot[0],
    standFootZ: footLut.samples[0].foot[1],
  };
  // 相位顺序：FR=0, RR=0.25, FL=0.5, RL=0.75（依次抬腿）
  const phaseOffset = { FR:0, RR:0.25, FL:0.5, RL:0.75 };
  let lastUI = 0;
  runLoop(t => {
    for (const leg of LEGS) {
      const [fx, fz] = marchFoot(t, cfg, phaseOffset[leg.key]);
      const theta = footToTheta(fx, fz);
      if (theta) setLegSilent(leg.key, theta[0], theta[1]);
    }
    if (t - lastUI > 0.1) { lastUI = t; for (const leg of LEGS) refreshLegUI(leg.key); }
    setStatus(`预设：原地踏步 t=${t.toFixed(1)}s`);
  });
}

// march 足端轨迹：占空比 0.75
// phase 0..0.75 撑地（贴地不动），0.75..1 摆动（抬起 + 小幅前后）
function marchFoot(t, cfg, offset) {
  const phase = (((t / cfg.T) + offset) % 1 + 1) % 1;  // 0..1
  const baseX = cfg.standFootX;
  const baseZ = cfg.standFootZ;
  if (phase < 0.75) {
    // 撑地相：足端贴地，原地不动（不前后推）
    return [baseX, baseZ];
  } else {
    // 摆动相：抬起 + 小幅前后（前摆准备落地）
    const f = (phase - 0.75) / 0.25;  // 0..1
    const x = baseX + cfg.stride * Math.sin(Math.PI * f);  // 中间最前，两端回 baseX
    const z = baseZ + cfg.swingHeight * Math.sin(Math.PI * f);
    return [x, z];
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  // 每帧推进所有正在追踪的腿（拖地图触发的追踪）
  for (const leg of LEGS) stepLegTowards(leg.key);
  renderer.render(scene, camera);
}
function onResize() {
  const vp = document.getElementById('viewport');
  camera.aspect = vp.clientWidth/vp.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(vp.clientWidth, vp.clientHeight);
}
function setStatus(s) { document.getElementById('status').textContent = s; }

window.addEventListener('error', e => {
  setStatus('❌ 错误: ' + e.message + ' (行' + (e.lineno||'?') + ')');
  document.getElementById('loading').textContent = '❌ ' + e.message;
  console.error(e.error || e);
});
window.addEventListener('unhandledrejection', e => {
  setStatus('❌ Promise错误: ' + (e.reason && e.reason.message || e.reason));
  console.error('unhandledrejection:', e.reason);
});
window.addEventListener('load', init);
</script>
</body>
