<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>碰撞体配置器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; font-family:-apple-system,"PingFang SC",sans-serif; }
body { display:flex; background:#1e1e1e; color:#ddd; }
#viewport { flex:1; position:relative; }
#viewport canvas { display:block; width:100%; height:100%; }

#panel {
    width:340px; background:#252526; border-left:1px solid #3c3c3c;
    display:flex; flex-direction:column; overflow:hidden;
}
#panel h1 { font-size:13px; color:#4ec9b0; padding:10px 14px; background:#2d2d2d; border-bottom:1px solid #3c3c3c; }
.section { padding:10px 14px; border-bottom:1px solid #3c3c3c; }
.section h2 { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
.hint { font-size:11px; color:#888; line-height:1.5; }
.btn {
    padding:6px 12px; background:#0e639c; color:#fff; border:none; border-radius:3px;
    cursor:pointer; font-size:12px; margin-right:4px; margin-top:4px;
}
.btn:hover { background:#1177bb; }
.btn.secondary { background:#3a3d41; }
.btn.danger { background:#a33; }
.btn:disabled { background:#555; cursor:not-allowed; }
input[type="number"], select {
    background:#3c3c3c; color:#ddd; border:1px solid #555; border-radius:3px;
    padding:3px 6px; font-size:12px; width:60px;
}
.field { display:flex; align-items:center; gap:6px; margin:6px 0; font-size:12px; }
.field label { min-width:60px; color:#aaa; }

#cylinderList { flex:1; overflow-y:auto; padding:8px 14px; }
.cyl-item {
    background:#2a2d2e; padding:8px 10px; border-radius:4px; margin-bottom:6px; font-size:11px;
    font-family:monospace; display:flex; flex-direction:column; gap:2px;
}
.cyl-item .head { display:flex; justify-content:space-between; align-items:center; }
.cyl-item .name { color:#4ec9b0; font-weight:bold; }
.cyl-item .del { background:#a33; color:#fff; border:none; border-radius:2px; padding:2px 6px; cursor:pointer; font-size:10px; }
.cyl-item .info { color:#aaa; }
.cyl-item.selected { outline:2px solid #ffcc00; }

#status {
    position:absolute; bottom:12px; left:12px; padding:8px 12px;
    background:rgba(0,0,0,0.8); border-radius:4px; font-size:12px; pointer-events:none;
    max-width:60%;
}
#status.click { background:rgba(0,100,200,0.9); }
#crosshair {
    position:absolute; width:20px; height:20px; border:2px solid #ffcc00; border-radius:50%;
    pointer-events:none; transform:translate(-50%,-50%); display:none;
}
</style>
</head>
<body>
<div id="viewport">
    <div id="status">加载中…</div>
    <div id="crosshair"></div>
</div>
<div id="panel">
    <h1>🎯 碰撞体配置器</h1>

    <div class="section">
        <h2>操作</h2>
        <div class="hint">
            <b>添加圆柱：</b>点「开始标记」→ 在 3D 里点第一个端点 → 点第二个端点 → 自动生成圆柱。<br>
            <b>关联零件：</b>圆柱跟随所选 body 运动。<br>
            <b>关节圆柱：</b>点「加关节圆柱」在每个旋转点自动放 r=3mm 销。
        </div>
        <div style="margin-top:8px;">
            <button class="btn" id="addThighBtn">➕ 标记大腿圆柱</button>
            <button class="btn secondary" id="addJointBtn">⚙ 加全部关节销</button>
        </div>
        <div class="field">
            <label>半径(mm)</label>
            <input type="number" id="radiusInput" value="5" step="0.5" min="0.5">
            <label style="min-width:auto;">归属</label>
            <select id="bodySelect">
                <option value="thigh_rigid">大腿</option>
                <option value="knee_driver">膝盖动力</option>
                <option value="knee_link1">传动1</option>
                <option value="knee_rotor">膝盖转动</option>
                <option value="knee_link2">传动2</option>
                <option value="shin">小腿</option>
            </select>
        </div>
    </div>

    <div class="section">
        <h2>显示</h2>
        <div class="field" style="margin:0;">
            <label><input type="checkbox" id="showColMesh" checked> COL_GROUP 实体</label>
            <label><input type="checkbox" id="showCylinders" checked> 碰撞圆柱</label>
            <label><input type="checkbox" id="showJoints"> 关节点</label>
        </div>
    </div>

    <div class="section" style="border-bottom:none;">
        <h2>已配置碰撞体 <span id="cylCount" style="color:#4ec9b0;"></span></h2>
    </div>
    <div id="cylinderList"></div>

    <div class="section" style="border-top:1px solid #3c3c3c;">
        <button class="btn" id="saveBtn">💾 保存 collision_config.json</button>
        <button class="btn secondary" id="loadBtn">📂 加载已有配置</button>
        <button class="btn danger" id="clearBtn">🗑 清空</button>
    </div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="collision_editor.js"></script>
</body>
</html>
